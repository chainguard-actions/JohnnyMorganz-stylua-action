name: Test basic usage - format Lua file with latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Lua file to format
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lua-test"
          cat > "$GITHUB_WORKSPACE/lua-test/hello.lua" << 'EOF'
          local x = 1
          local y = 2
          local z = x + y
          print(z)
          EOF

      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: "${{ github.workspace }}/lua-test/hello.lua"

      - name: Assert Lua file still exists after formatting
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/lua-test/hello.lua" ]; then
            echo "FAIL: Lua file not found after formatting"
            exit 1
          fi
          echo "PASS: Lua file exists after formatting"

      - name: Assert StyLua binary is available on PATH
        run: |
          if ! command -v stylua > /dev/null 2>&1; then
            echo "FAIL: stylua binary not found on PATH"
            exit 1
          fi
          echo "PASS: stylua is available at $(command -v stylua)"
          stylua --version
