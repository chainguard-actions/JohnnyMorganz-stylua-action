name: Test StyLua basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Lua file to format
        run: |
          mkdir -p /tmp/lua-test
          cat > /tmp/lua-test/hello.lua << 'EOF'
          local x = 1
          local y = 2
          local z = x + y
          print(z)
          EOF

      - name: Run StyLua on Lua file
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          version: "0.20.0"
          args: "/tmp/lua-test/hello.lua"

      - name: Assert StyLua ran successfully
        run: |
          echo "StyLua action completed successfully"
          if [ ! -f "/tmp/lua-test/hello.lua" ]; then
            echo "FAIL: Lua file not found after formatting"
            exit 1
          fi
          echo "PASS: Lua file exists after formatting"
