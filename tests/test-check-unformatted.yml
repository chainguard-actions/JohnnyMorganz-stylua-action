name: Test StyLua check mode detects unformatted code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an unformatted Lua file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lua-test"
          # Write a Lua file with inconsistent formatting (no spaces around operators, no indentation)
          printf 'local function greet(name)\nprint("Hello, "..name)\nend\ngreet("world")\n' \
            > "$GITHUB_WORKSPACE/lua-test/unformatted.lua"
          echo "Created unformatted Lua file:"
          cat "$GITHUB_WORKSPACE/lua-test/unformatted.lua"

      - name: Run StyLua check and expect failure
        id: stylua-check
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "0.20.0"
          args: --check "${{ github.workspace }}/lua-test/unformatted.lua"
        continue-on-error: true

      - name: Assert that StyLua detected unformatted code
        env:
          OUTCOME: ${{ steps.stylua-check.outcome }}
        run: |
          echo "stylua-check outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected StyLua to fail on unformatted code, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: StyLua correctly detected unformatted code"
