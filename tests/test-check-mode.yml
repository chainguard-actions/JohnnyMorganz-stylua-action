name: Test StyLua check mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a properly formatted Lua file
        run: |
          mkdir -p /tmp/lua-check
          # Write a properly formatted Lua file (StyLua style)
          cat > /tmp/lua-check/formatted.lua << 'EOF'
          local x = 1
          local y = 2
          local z = x + y
          print(z)
          EOF

      - name: Run StyLua in check mode on formatted file
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          version: "0.20.0"
          args: "--check /tmp/lua-check/formatted.lua"

      - name: Assert check mode completed
        run: |
          echo "StyLua check mode completed"
          echo "PASS: StyLua --check ran successfully"
