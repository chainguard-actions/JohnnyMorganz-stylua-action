name: Test StyLua detects formatting issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a badly-formatted Lua file
        run: |
          mkdir -p /tmp/lua-bad
          # Write a file with no indentation inside function body (StyLua will want tabs)
          printf 'local function greet(name)\nprint("Hello, " .. name)\nend\n\ngreet("world")\n' > /tmp/lua-bad/bad.lua
          echo "Created badly-formatted Lua file:"
          cat /tmp/lua-bad/bad.lua

      - name: Run StyLua check on badly-formatted file (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          version: "0.20.0"
          args: "--check /tmp/lua-bad/bad.lua"

      - name: Assert action failed due to formatting issues
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on badly-formatted Lua, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: StyLua correctly detected formatting issues"
