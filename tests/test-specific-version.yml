name: Test StyLua with a specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Lua file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lua-test"
          # Write a simple Lua file that StyLua will not need to change
          printf 'print("hello")\n' > "$GITHUB_WORKSPACE/lua-test/hello.lua"
          echo "Created Lua file:"
          cat "$GITHUB_WORKSPACE/lua-test/hello.lua"

      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "0.20.0"
          args: --check "${{ github.workspace }}/lua-test/hello.lua"

      - name: Assert stylua binary is available and correct version
        run: |
          echo "Checking stylua is on PATH..."
          ACTUAL_VERSION=$(stylua --version 2>&1 || echo "not found")
          echo "actual version: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "0.20.0"; then
            echo "FAIL: expected version 0.20.0 but got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: stylua 0.20.0 is installed and on PATH"
